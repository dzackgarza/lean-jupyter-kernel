# Tag-triggered source release.
#
# Publishes release notes for the pushed tag. CI already proved the tree;
# this workflow does not rebuild unpublished artifacts.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: tag matches declared version and is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged=$(gh api "repos/${{ github.repository }}/commits/$RELEASE_TAG" --jq .sha)
          test "$tagged" = "$GITHUB_SHA" || {
            echo "$RELEASE_TAG resolves to $tagged, not event commit $GITHUB_SHA"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_SHA is not reachable from protected main"; exit 1; }
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('release.toml','rb'))['release']['version'])")
          test "v$VERSION" = "$RELEASE_TAG" || {
            echo "tag $RELEASE_TAG does not match version $VERSION"; exit 1; }

      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "Release $RELEASE_TAG at commit $GITHUB_SHA. Compatibility: release.toml at this tag. Install from GitHub at this tag's commit."
