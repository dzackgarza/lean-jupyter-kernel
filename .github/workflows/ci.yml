name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEAN_NUM_THREADS: 1

jobs:
  core:
    name: worker (mathlib-free gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: worker
          auto-config: false
          build: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: bounded core worker build
        run: bash -c 'cd worker && lake build nbdsl_worker'

      - name: boundary — the core must never import DSL modules
        run: |
          ! grep -rn '^import NbDsl' worker/ --include='*.lean'

  dsl:
    name: NbDsl + installed notebook journeys
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mathlib
            dsls/nbdsl/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('dsls/nbdsl/lean-toolchain', 'dsls/nbdsl/lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: dsls/nbdsl
          auto-config: false
          build: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: bounded Mathlib cache preparation
        run: bash -c 'cd dsls/nbdsl && lake exe cache get'

      - name: bounded NbDsl build
        run: bash -c 'cd dsls/nbdsl && lake build NbDsl'

      - name: build worker executable
        working-directory: worker
        run: lake build nbdsl_worker

      - name: mypy (strict)
        run: |
          pip install mypy pydantic ipykernel jupyter_client pytest psutil types-psutil
          MYPYPATH=nbdsl_kernel/tests:nbdsl_kernel mypy --config-file mypy.ini \
            nbdsl_kernel/nbdsl_kernel nbdsl_kernel/tests conformance

      - name: protocol round-trip
        run: python3 nbdsl_kernel/tests/roundtrip.py

      - name: install kernel package and kernelspec
        run: |
          pip install -e './nbdsl_kernel[test]'
          python -m nbdsl_kernel.install --project "$PWD/dsls/nbdsl"

      - name: end-to-end through the Jupyter protocol
        run: pytest nbdsl_kernel/tests/test_e2e.py

      - name: Journey 1 — clean installed NbDsl notebook
        run: pytest nbdsl_kernel/tests/test_clean_install.py

      - name: wire protocol + recovery
        run: |
          pytest nbdsl_kernel/tests/test_identity.py \
              nbdsl_kernel/tests/test_restart.py

      - name: worker resolve and inspection
        run: |
          pytest nbdsl_kernel/tests/test_worker_resolve.py \
              nbdsl_kernel/tests/test_inspect.py

      - name: install just
        uses: extractions/setup-just@v3
      - name: NbDsl semantic journeys
        run: |
          just _conformance

  compat:
    name: compatibility + external consumer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: release projections agree with release.toml
        run: python3 scripts/release_projection.py check

      # Toolchain for the consumer's Lake graph (qualification builds the
      # candidate worker through that graph, not a root rebuild here).
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: worker
          auto-config: false
          build: false
          use-mathlib-cache: false
          use-github-cache: false

      # The 10.7 pin is provisioning: the frozen consumer baseline spawns its
      # adapter as `sage -python` (see lean-cas-dsl#34).
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sage
          create-args: sage=10.7 python=3.12
          cache-environment: true
          generate-run-shell: true

      - name: install just
        uses: extractions/setup-just@v3

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - uses: actions/cache@v6
        with:
          path: ~/.cache/mathlib
          key: consumer-mathlib-${{ runner.os }}-${{ hashFiles('scripts/qualify_consumer.sh') }}

      - name: qualify the exact kernel candidate against the frozen consumer
        shell: micromamba-shell {0}
        env:
          KERNEL_GIT_URL: file://${{ github.workspace }}
        run: scripts/qualify_consumer.sh "$(git rev-parse HEAD)" "$RUNNER_TEMP/qualification"

  frontend:
    name: jupyterlab extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: install jupyterlab
        run: pip install jupyterlab

      - working-directory: jupyterlab_nbdsl
        run: |
          jlpm install
          jlpm test

      - name: distributable wheel builds, installs, and activates cleanly
        working-directory: jupyterlab_nbdsl
        run: |
          pip install build
          python -m build --wheel
          python -m venv /tmp/labclean
          /tmp/labclean/bin/pip install jupyterlab dist/jupyterlab_nbdsl-*.whl
          /tmp/labclean/bin/jupyter labextension list 2>&1 | tee /tmp/labext.txt
          grep -E "jupyterlab_nbdsl v.*(enabled|OK)" /tmp/labext.txt
