name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_REVIEW_CI_SHA: 07c8cf3fbc766e45ced22b058d1b00810166c614

jobs:
  core:
    name: worker (mathlib-free gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The worker is mathlib-free and builds in seconds: no cache, no
      # mathlib fetch — this job is the fast signal on every push.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: worker
          build-args: nbdsl_worker
          use-mathlib-cache: false
          use-github-cache: false

      - name: boundary — the core must never import DSL modules
        run: |
          ! grep -rn '^import NbDsl' worker/ --include='*.lean'

  dsl:
    name: NbDsl + installed notebook journeys
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: install Bubblewrap sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor by default. The hosted runner is ephemeral; permit the
          # namespace creation that the production Bubblewrap path requires.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Keyed on the dependency set, not the commit, so warm runs hit: the
      # ~5GB of mathlib oleans is re-saved only when deps or toolchain move.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mathlib
            dsls/nbdsl/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('dsls/nbdsl/lean-toolchain', 'dsls/nbdsl/lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: dsls/nbdsl
          build-args: NbDsl
          use-mathlib-cache: true
          use-github-cache: false  # cached above, keyed on deps rather than SHA

      # The DSL build pulls the worker in as a path dependency but not its
      # executable, which the kernel spawns.
      - name: build worker executable
        working-directory: worker
        run: lake build nbdsl_worker

      - name: mypy (strict, mirrors ai-review-ci's global config)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/dzackgarza/ai-review-ci/${AI_REVIEW_CI_SHA}/tool-configs/mypy-global.ini" -o /tmp/mypy-global.ini
          pip install mypy pydantic ipykernel jupyter_client pytest pyyaml psutil types-psutil types-pyyaml
          MYPYPATH=nbdsl_kernel/tests:nbdsl_kernel mypy --config-file /tmp/mypy-global.ini \
            nbdsl_kernel/nbdsl_kernel nbdsl_kernel/tests conformance

      - name: protocol round-trip
        run: python3 nbdsl_kernel/tests/roundtrip.py

      # `build` is the identity suite's: one law builds a wheel from a scratch
      # clone to prove an installer's own droppings do not read as dirty.
      - name: install kernel package and kernelspec
        run: |
          pip install -e './nbdsl_kernel[test]' build
          python -m nbdsl_kernel.install --project "$PWD/dsls/nbdsl"

      - name: install JupyterLab extension dependencies
        working-directory: jupyterlab_nbdsl
        run: jlpm install

      - name: end-to-end through the Jupyter protocol
        run: pytest nbdsl_kernel/tests/test_e2e.py

      - name: Journey 1 — clean installed NbDsl notebook
        run: pytest nbdsl_kernel/tests/test_clean_install.py

      # The identity/provenance laws that drive the INSTALLED kernelspec run
      # here, where that spec exists; the compat job proves the wheel-and-
      # clean-environment claims with fixtures that install their own specs.
      - name: adapter/worker identity through the installed kernelspec
        run: pytest nbdsl_kernel/tests/test_identity.py nbdsl_kernel/tests/test_restart.py

      - name: runner contracts, inspection, and sandbox boundary
        run: |
          pytest conformance/test_runner_contracts.py nbdsl_kernel/tests/test_inspect.py
          python3 nbdsl_kernel/tests/sandbox_check.py

      # Semantic plugin conformance (#3). The in-repository reference plugin
      # runs here, where the worker, the DSL and the kernel package are all
      # already built. The external plugin's profile is driven by the consumer
      # qualification job, which owns clean checkouts (#6).
      - name: semantic conformance — NbDsl profile
        run: python3 conformance/runner.py conformance/nbdsl.toml

  compat:
    name: compatibility + external consumer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # -- compatibility authority: one-way derivation, and the negative case
      - name: release projections agree with release.toml (and reject mutation)
        run: |
          python3 -m pip install pytest pyyaml
          pytest -q conformance/test_release_governance.py
          python3 scripts/release_projection.py check
          python3 scripts/release_projection.py selftest

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: worker
          build-args: nbdsl_worker
          use-mathlib-cache: false
          use-github-cache: false

      # -- the real Sage backend for the external consumer's boundary
      #
      # The 10.7 pin is provisioning, not a workaround: the consumer spawns
      # its adapter as `sage -python backends/sage_adapter.py` (roundtrip.py
      # and CasDsl/Backends/Sage.lean both hardcode it), and `-python` is a
      # flag of the SageMath *distribution* launcher. conda-forge shipped that
      # launcher through sagelib 10.7; from 10.8 on, `bin/sage` is the
      # `sage.cli.__main__:main` console script, whose argparse rejects
      # `-python` outright. 10.7 is therefore the newest conda-forge Sage that
      # satisfies the frozen consumer baseline's documented launcher contract.
      # The portability defect is the consumer's and is filed as
      # dzackgarza/lean-cas-dsl#34 — it is not this repository's to fix, and
      # the qualification stop rule forbids adapting the consumer here.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sage
          create-args: sage=10.7 python=3.12
          cache-environment: true
          generate-run-shell: true

      - name: install just
        uses: extractions/setup-just@v3

      # The consumer's own `just setup` provisions its venv with uv.
      - name: install uv
        uses: astral-sh/setup-uv@v6

      # The consumer's `just test` delegates its Lean QC to the global
      # justfiles at ~/ai-review-ci, which a workstation has and a runner does
      # not. Qualification runs that gate verbatim — the stop rule is to
      # provision what the consumer needs, never to adapt the consumer.
      - name: provision the global QC justfiles the consumer gate delegates to
        run: |
          git init --quiet ~/ai-review-ci
          git -C ~/ai-review-ci remote add origin https://github.com/dzackgarza/ai-review-ci
          git -C ~/ai-review-ci fetch --quiet --depth 1 origin "$AI_REVIEW_CI_SHA"
          git -C ~/ai-review-ci checkout --quiet --detach FETCH_HEAD
          [ "$(git -C ~/ai-review-ci rev-parse HEAD)" = "$AI_REVIEW_CI_SHA" ]

      # Mathlib oleans for the consumer build, keyed on the profile that owns
      # the frozen baseline (rolls automatically when the baseline promotes).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mathlib
          key: consumer-mathlib-${{ runner.os }}-${{ hashFiles('conformance/lean-cas-dsl.toml') }}

      # -- exact-candidate qualification (#6): frozen consumer baseline,
      #    both channels overridden to THIS commit via the runner's own
      #    checkout, real build + Sage roundtrip + Jupyter E2E + external
      #    semantic conformance, provenance readback, unchanged worktree.
      - name: qualify the exact kernel candidate against the frozen consumer
        shell: micromamba-shell {0}
        env:
          KERNEL_GIT_URL: file://${{ github.workspace }}
        run: |
          scripts/qualify_consumer.sh "$(git rev-parse HEAD)" "$RUNNER_TEMP/qualification"
          jq -e --arg expected "$AI_REVIEW_CI_SHA" \
            '.ai_review_ci_sha == $expected' \
            "$RUNNER_TEMP/qualification/qualification-evidence.json"

      - name: publish qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-evidence
          path: |
            ${{ runner.temp }}/qualification/qualification-evidence.json
            ${{ runner.temp }}/qualification/conformance-result.json
            ${{ runner.temp }}/qualification/worktree-status.txt
          if-no-files-found: error

  frontend:
    name: jupyterlab extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: install jupyterlab  # provides jlpm and the labextension builder
        run: pip install jupyterlab

      - working-directory: jupyterlab_nbdsl
        run: |
          jlpm install
          jlpm test
          jlpm build

      # The release claim is the ARTIFACT, not the build: the wheel must
      # contain the production labextension and activate in a clean
      # JupyterLab 4 environment with no dev symlink.
      - name: distributable wheel builds, installs, and activates cleanly
        working-directory: jupyterlab_nbdsl
        run: |
          pip install build
          marker="--jupyterlab-nbdsl-wheel-source: ${GITHUB_SHA};"
          printf '\n:root { %s }\n' "$marker" >> style/index.css
          python -m build --wheel
          unzip -p dist/jupyterlab_nbdsl-*.whl '*/static/*' | grep -F -- "$marker"
          python -m venv /tmp/labclean
          /tmp/labclean/bin/pip install jupyterlab dist/jupyterlab_nbdsl-*.whl
          /tmp/labclean/bin/jupyter labextension list 2>&1 | tee /tmp/labext.txt
          grep -E "jupyterlab_nbdsl v.*(enabled|OK)" /tmp/labext.txt
          jlpm pack
