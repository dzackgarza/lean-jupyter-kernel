[project]
name = "nbdsl-kernel"
version = "1.1.0"
description = "Jupyter wrapper kernel for the nbdsl Lean 4 elaborated DSL"
requires-python = ">=3.11"
dependencies = ["ipykernel>=6.9", "pydantic>=2"]

[project.optional-dependencies]
test = ["jupyter_client>=8", "pytest"]

# Mirrors the test extra: ai-review-ci's mypy/pytest gate resolves PEP 735
# dependency groups, while pip-based installs use the extra above.
[dependency-groups]
dev = ["jupyter_client>=8", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Generates nbdsl_kernel/_build_info.json for every target (wheel and
# editable). See hatch_build.py.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["nbdsl_kernel"]
# The build identity is generated, hence gitignored; hatchling excludes
# VCS-ignored files unless they are declared as build artifacts.
artifacts = ["nbdsl_kernel/_build_info.json"]
