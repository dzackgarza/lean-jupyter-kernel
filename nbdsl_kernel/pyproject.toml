[project]
name = "nbdsl-kernel"
version = "1.1.0"
description = "Jupyter wrapper kernel for the nbdsl Lean 4 elaborated DSL"
requires-python = ">=3.11"
dependencies = ["ipykernel>=6.9", "psutil>=7", "pydantic>=2"]

[project.optional-dependencies]
test = ["build", "jupyter_client>=8", "jupyterlab>=4.0,<5", "pytest",
        "types-psutil"]

# Mirrors the test extra: ai-review-ci's mypy/pytest gate resolves PEP 735
# dependency groups, while pip-based installs use the extra above.
[dependency-groups]
dev = ["build", "jupyter_client>=8", "jupyterlab>=4.0,<5", "pytest",
       "types-psutil"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nbdsl_kernel"]
