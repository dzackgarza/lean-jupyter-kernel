# The one authored static compatibility contract for lean-jupyter-kernel.
#
# Every tool-owned version/toolchain declaration in this repository is a
# GENERATED projection of this file (scripts/release_projection.py write);
# CI fails if any projection drifts (… check). The release tag is derived
# deterministically as "v" + release.version. Build provenance adds the
# exact clean git commit at build time — a tracked file cannot truthfully
# contain its own commit, so that value never appears here.
#
# Keep this file trivially line-parseable: one `key = value` per line,
# string values double-quoted, integer values bare. The Lake build-info
# target reads it with a strict line parser.

schema = 1

[release]
version = "1.1.0"

[toolchain]
lean = "leanprover/lean4:v4.32.0"
mathlib = "v4.32.0"

[compat]
plugin_api = 1
wire_protocol = 1
